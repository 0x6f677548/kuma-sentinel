version: '3.8'

services:
  kuma-scout:
    build:
      context: .
      dockerfile: Dockerfile
    image: kuma-scout:latest
    container_name: kuma-scout
    
    # Load authentication tokens from .env file
    # All other configuration must be provided via config.yaml file
    env_file:
      - .env
    
    # Volume mounts for logs, data, and configuration
    volumes:
      - ./logs:/var/log/kuma-scout
      - ./data:/data
      - ./config.yaml:/etc/kuma-scout/config.yaml:ro
    
    # Run in interactive mode
    stdin_open: true
    tty: true
    
    # Network (for future services like Uptime Kuma)
    networks:
      - kuma-network

networks:
  kuma-network:
    driver: bridge
