# Kuma Scout Configuration (New Format)
# This is the main configuration file for kuma-scout monitoring agent

# === GLOBAL SETTINGS ===
# These settings apply to all checks unless overridden per-check

uptime_kuma:
  # Uptime Kuma API base URL (required)
  url: http://uptimekuma:3001/api/push
  # Global push token (can be overridden per-check)
  token: "${UPTIME_KUMA_TOKEN}"

logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL (default: INFO)
  level: INFO
  # Log file path (default: stdout only)
  file: /var/log/kuma-scout.log

# Skip validation that config file has restricted permissions (0o600)
# Only set to true for development/testing in environments like Docker
# In production, always ensure config file has permissions 0o600
# Default: false (permissions are validated)
ignore_file_permissions: false

# Global timeout for checks in seconds (default: 300)
# Individual checks can override this with their own timeout setting
timeout: 300

# === GLOBAL SSH CONFIGURATION ===
# Default SSH settings for remote execution (can be overridden per-check)
ssh:
  # SSH host (user@host or host)
  host: backup-server.example.com
  # Path to SSH private key (recommended over password)
  key_file: /etc/kuma-scout/ssh_key
  # SSH password (discouraged, use key_file instead)
  # password: "${SSH_PASSWORD}"
  # Verify SSH host keys (default: true, recommended for security)
  strict_host_key_checking: true

# === HEARTBEAT CONFIGURATION ===
heartbeat:
  # Enable heartbeat pings during checks (default: true)
  enabled: true
  # Interval in seconds between heartbeat pings (default: 300)
  interval: 300
  # Uptime Kuma configuration for heartbeat (url inherits from global if not set)
  uptime_kuma:
    # Token is required for heartbeat to work
    token: "${HEARTBEAT_TOKEN}"
    # URL is optional - if not set, heartbeat uses the global uptime_kuma.url
    # Uncomment to override the global URL for heartbeat only:
    # url: "http://alternative-heartbeat-kuma:3001/api/push"

# === TAG-BASED RESULT AGGREGATION ===
# Configure uptime_kuma for aggregated check results by tag
# When running with --tag flags, aggregated results are sent to these configurations
# Individual check results still go to their specific tokens
tags:
  services:
    uptime_kuma:
      token: "${TAG_SERVICES_TOKEN}"
    description: "Aggregated status for all service checks"
  web:
    uptime_kuma:
      token: "${TAG_WEB_TOKEN}"
    description: "Aggregated status for web service checks"
  backup:
    # Example with URL override for secondary Uptime Kuma instance
    uptime_kuma:
      url: "http://secondary-uptimekuma:3001/api/push"
      token: "${TAG_BACKUP_SECONDARY_TOKEN}"
    description: "Aggregated status for backup checks sent to secondary instance"

# === CHECKS ===
# List of monitoring checks to execute
checks:
  # === SERVICE HEALTH CHECKS ===
  - name: nginx_status
    type: cmdcheck
    command: "systemctl is-active nginx"
    expect_exit_code: 0
    timeout: 10
    tags: [services, web]
    uptime_kuma:
      # Override token for this check only (url comes from global config)
      token: "${WEB_TOKEN}"

  - name: nginx_errors
    type: cmdcheck
    command: "grep -i error /var/log/nginx/error.log"
    timeout: 10
    tags: [services, web, logs]
    # No check-level token, will use global token

  - name: app_pid_file
    type: cmdcheck
    command: "test -f /var/run/app.pid"
    expect_exit_code: 0
    timeout: 5
    tags: [services, app]

  - name: database_status
    type: cmdcheck
    command: "systemctl is-active postgresql"
    expect_exit_code: 0
    timeout: 10
    tags: [services, database, critical]
    uptime_kuma:
      # Override token for this check only
      token: "${POSTGRESQL_TOKEN}"

  - name: local_web_server
    type: cmdcheck
    command: "systemctl is-active nginx"
    expect_exit_code: 0
    timeout: 10
    tags: [services, web]
    uptime_kuma:
      # Override token for this check only
      token: "${WEB_TOKEN}"

  - name: local_database
    type: cmdcheck
    command: "systemctl is-active postgresql"
    expect_exit_code: 0
    timeout: 15
    tags: [services, database, critical]
    uptime_kuma:
      # Override token for this check only
      token: "${DB_TOKEN}"

  # === REMOTE SERVICE CHECKS ===
  - name: remote_web_server
    type: cmdcheck
    command: "systemctl is-active apache2"
    expect_exit_code: 0
    timeout: 10
    tags: [services, web, remote]
    ssh:
      host: web-server.prod.example.com
    uptime_kuma:
      # Override token for this check (url still from global)
      token: "${REMOTE_WEB_TOKEN}"

  - name: remote_database
    type: cmdcheck
    command: "systemctl is-active mysql"
    expect_exit_code: 0
    timeout: 15
    tags: [services, database, remote, critical]
    ssh:
      host: db-server.prod.example.com
      key_file: /etc/kuma-scout/prod_db_key
    uptime_kuma:
      # Override both URL and token for this check
      url: "http://secondary-uptimekuma:3001/api/push"
      token: "${SECONDARY_UPTIMEKUMA_TOKEN}"

  # === BACKUP CHECKS ===
  - name: backup_integrity
    type: cmdcheck
    command: "test -f /backups/latest.tar.gz"
    expect_exit_code: 0
    timeout: 30
    retry:
      attempts: 3
      delay_seconds: 5
    tags: [backups, critical]
    ssh:
      host: backup@nas.prod.example.com:2222
      key_file: /etc/kuma-scout/backup_key
    uptime_kuma:
      token: "${BACKUP_TOKEN}"

  # === ROUTINE SYSTEM CHECKS ===
  - name: log_directory_check
    type: cmdcheck
    command: "test -d /var/log"
    expect_exit_code: 0
    timeout: 5
    tags: [system, logs]

  - name: system_load
    type: cmdcheck
    command: "uptime"
    timeout: 5
    tags: [system, monitoring]

  # === PATTERN MATCHING EXAMPLES ===
  - name: nginx_detailed
    type: cmdcheck
    command: "systemctl status nginx"
    success_pattern: "active.*running"
    failure_pattern: "failed|error"
    timeout: 10
    tags: [services, web, detailed]
  # === PORT SCAN CHECKS ===
  - name: lan_ports
    type: portscan
    targets: ["192.168.100.110-199"]
    ports: "1-1000"
    timeout: 3600
    timing: "T5"
    tags: [network, security]
    uptime_kuma:
      token: "${PORTSCAN_TOKEN}"
    ssh:
      host: nas-server.local

  - name: dmz_ports
    type: portscan
    targets: ["10.0.0.0/24"]
    ports: "1-1000"
    timeout: 3600
    timing: "T3"
    tags: [network, security, dmz]
    uptime_kuma:
      token: "${PORTSCAN_TOKEN}"

  - name: internal_ports
    type: portscan
    targets: ["192.168.1.0/24"]
    ports: "22,80,443,3389"
    timeout: 1800
    timing: "T3"
    tags: [network, security, internal]
    uptime_kuma:
      token: "${PORTSCAN_TOKEN}"

  # === KOPIA SNAPSHOT CHECKS ===
  - name: data_backup
    type: kopiasnapshotstatus
    path: "/data"
    max_age_hours: 24
    tags: [backups, data]
    uptime_kuma:
      token: "${KOPIA_TOKEN}"
    ssh:
      host: kopia-server.local

  - name: archive_backup
    type: kopiasnapshotstatus
    path: "/backups"
    max_age_hours: 48
    tags: [backups, archive]
    uptime_kuma:
      token: "${KOPIA_TOKEN}"
    ssh:
      host: kopia-server.local

  # === ZFS POOL CHECKS ===
  - name: primary_pool
    type: zfspoolstatus
    pool: "tank"
    min_free_percent: 10
    tags: [storage, zfs, critical]
    uptime_kuma:
      token: "${ZFS_TOKEN}"
    ssh:
      host: zfs-server.local

  - name: backup_pool
    type: zfspoolstatus
    pool: "backup"
    min_free_percent: 20
    tags: [storage, zfs, backups]
    uptime_kuma:
      token: "${ZFS_TOKEN}"
    ssh:
      host: zfs-server.local

  - name: archive_pool
    type: zfspoolstatus
    pool: "archive"
    min_free_percent: 5
    tags: [storage, zfs, archive]
    uptime_kuma:
      token: "${ZFS_TOKEN}"
    ssh:
      host: zfs-server.local
