[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kuma-scout"
version = "0.2.1"
description = "Uptime Kuma monitoring agent for internal server monitoring. Execute custom checks, scan ports, monitor backups and storage—then report to Uptime Kuma via push API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Hugo Batista <code at hugobatista.com>" }
]
keywords = ["uptime-kuma-agent", "uptime-kuma", "monitoring-agent", "uptime-monitoring", "server-monitoring", "port-scanner", "network-monitoring", "system-monitoring", "nmap", "backup-monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=10.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
lint = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
dev = [
    "hatch>=1.16.5",
    {include-group = "lint"},
    {include-group = "test"},
]

[project.urls]
Homepage = "https://go.hugobatista.com/gh/kuma-scout"
Documentation = "https://go.hugobatista.com/gh/kuma-scout#readme"
Repository = "https://go.hugobatista.com/gh/kuma-scout.git"
Issues = "https://go.hugobatista.com/gh/kuma-scout/issues"

[project.scripts]
kuma-scout = "kuma_scout.cli.app:cli"

[tool.uv]
exclude-newer = "30 days"
required-version = "0.11.18"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/kuma_scout"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/doc",
    "LICENSE",
    "README.md",
    "MANIFEST.in",
]





[tool.ruff]
line-length = 88
target-version = "py37"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # allow typer.Option in argument defaults (common pattern for CLI frameworks)
]

[tool.ruff.lint.isort]
known-first-party = ["kuma_scout"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
incremental = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
mypy_path = "src"
files = ["src"]
exclude = ["test_venv", ".venv"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v -ra --strict-markers --cov=src/kuma_scout --cov-report=html --cov-report=term-missing"

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
lint-check = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
typecheck = "mypy"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint-check", "format-check", "test", "typecheck"]
